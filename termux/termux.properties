# The Void OS — Termux Integration
# Add to ~/.termux/termux.properties for extra-key-hints

# Custom keyboard bar (optional)
# Uncomment and edit ~/.termux/termux.properties:
#
# extra-keys = [ \
#   [ {key: 'TAB', popup: 'TAB'} , {key: 'CTRL', popup: 'CTRL'}, {key: 'ALT', popup: 'ALT'}, '/' , {key: 'ESC', popup: 'ESC'} ] \
# ]
#
# Then run: termux-reload-settings

# Keybindings for The Void OS:
#   TAB    - autocomplete commands and paths
#   Ctrl+C - interrupt / cancel
#   Ctrl+L - clear screen
#   Ctrl+D - exit
#   ↑/↓    - command history
