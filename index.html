// VIRTUAL FILESYSTEM
// ═══════════════════════════════════════════════════════════════════════════
class VFile {
  constructor(name,isDir=false,content="",perms="-rw-r--r--",owner="root"){
    this.name=name;this.isDir=isDir;this.content=content;
    this.perms=perms;this.owner=owner;this.children={};this.size=content.length;
  }
  add(c){if(this.isDir)this.children[c.name]=c;}
  list(hide=false){return Object.values(this.children).filter(c=>hide||!c.name.startsWith("."));}
}

class VFS {
  constructor(){this.root=new VFile("/",true,"","drwxr-xr-x");this.cwd_node=this.root;this.cwd="/";}
  resolve(p){if(!p||p===".")return this.cwd_node;if(p.startsWith("~"))p="/home/hacker"+p.slice(1);let parts=p.split("/").filter(Boolean);let n=this.root;
    for(let x of parts){if(x===".")continue;if(x===".."){continue}if(!n.isDir||!n.children[x])return null;n=n.children[x];}return n;}
  ls(p,showHidden=false){let n=p?this.resolve(p):this.cwd_node;if(!n||!n.isDir)return null;return n.list(showHidden);}
  cat(p){let n=this.resolve(p);return n&&!n.isDir?n.content:null;}
  mkdir(p,name){let d=this.resolve(p);if(d&&d.isDir)d.add(new VFile(name,true,"","drwxr-xr-x"));}
  touch(p,name,content="",perms="-rw-r--r--"){let d=this.resolve(p);if(d&&d.isDir)d.add(new VFile(name,false,content,perms));}
  cd(p){if(!p||p==="/"){this.cwd_node=this.root;this.cwd="/";return true;}
    let parts=p.split("/").filter(Boolean);let n=this.root;
    for(let x of parts){if(x===".."){continue}if(!n.isDir||!n.children[x])return false;n=n.children[x];}
    if(!n.isDir)return false;this.cwd_node=n;this.cwd="/"+parts.join("/");return true;}
  find(pat){let r=[];this._findR(this.root,pat,r);return r;}
  _findR(n,pat,r){if(!n.isDir){if(!pat||n.name.includes(pat))r.push(n);return;}Object.values(n.children).forEach(c=>this._findR(c,pat,r));}
  grep(pat){let r=[];this._grepR(this.root,pat.toLowerCase(),r,"");return r;}
  _grepR(n,pat,r,pfx){if(!n.isDir){if(n.content.toLowerCase().includes(pat))r.push(pfx+n.name);return;}
    Object.values(n.children).forEach(c=>this._grepR(c,pat,r,pfx+n.name+"/"));}
}

// ═══════════════════════════════════════════════════════════════════════════
// VIRTUAL SHELL
// ═══════════════════════════════════════════════════════════════════════════
class VShell {
  constructor(fs){this.fs=fs;this.env={PATH:"/usr/local/bin:/usr/bin:/bin",user:"hacker"};this.history=[];}
  exec(raw){
    raw=raw.trim();if(!raw)return"";this.history.push(raw);
    if(raw==="exit")return"__EXIT__";
    // pipes
    if(raw.includes("|")){let parts=raw.split("|");let d="";for(let p of parts)d=this.exec(p.trim());return d;}
    // semicolons
    if(raw.includes(";")){return raw.split(";").map(p=>this.exec(p.trim())).filter(Boolean).join("\n");}
    // &&
    if(raw.includes("&&")){let[l,r]=raw.split("&&",1);let res=this.exec(l.trim());if(res&&!res.includes("error"))return res+"\n"+this.exec(r.trim());return res;}
    // redirection
    let append=false,redir=null,cmdPart=raw;
    for(let op of [[">>",true],[">",false]]){if(raw.includes(op[0])){let p=raw.split(op[0],1);cmdPart=p[0].trim();redir=p[1].trim();append=op[1];break;}}
    let tokens;try{tokens=cmdPart.match(/(?:[^\s"]+|"[^"]*")/g)||[];}catch(e){tokens=cmdPart.split(/\s+/);}
    if(!tokens.length)return"";
    let cmd=tokens[0],args=tokens.slice(1);
    // env set
    if(cmd.includes("=")&&!cmd.startsWith("-")){let[k,v]=cmd.split("=",1);if(v.startsWith("~"))v="/home/hacker"+v.slice(1);this.env[k]=v;return"";}
    let result=this._dispatch(cmd,args);
    if(redir!==null&&result!==null){if(redir.startsWith("~"))redir="/home/hacker"+redir.slice(1);let n=this.fs.resolve(redir);if(n&&!n.isDir){n.content=append?n.content+result:result;n.size=n.content.length;}
      else{this._ensureParent(redir);let pp=redir.split("/").slice(0,-1).join("/")||"/";let fn=redir.split("/").pop();this.fs.touch(pp,fn,result);}}
    return result||"";
  }
  _dispatch(cmd,args){
    const T={ls:this._ls,cat:this._cat,find:this._find,grep:this._grep,head:this._head,tail:this._tail,
      cd:this._cd,pwd:this._pwd,echo:this._echo,whoami:this._whoami,id:this._id,chmod:this._chmod,
      mkdir:this._mkdir,touch:this._touch,file:this._file,stat:this._stat,wc:this._wc,strings:this._strings,
      decode:this._decode,encode:this._encode,caesar:this._caesar,bruteforce:this._bruteforce,
      hash:this._hash,env:this._env,export:this._export,man:this._man,hint:this._hint,submit:this._submit,help:this._help};
    let fn=T[cmd];
    if(fn)return fn.call(this,args);
    if(cmd.startsWith("/")){let n=this.fs.resolve(cmd);if(n&&!n.isDir)return this._runScript(n.content,args);return""+cmd+": command not found";}
    return cmd+": command not found";
  }
  _runScript(script,args){
    let lines=script.split("\n"),output=[],ifStack=[],skipElse=false;
    for(let line of lines){line=line.trim();if(!line||line.startsWith("#"))continue;
      if(line.startsWith("if [")){try{let rest=line.slice(4,-2).trim();let[rest2,val]=rest.split("=");let varName=rest2.replace(/["\s]/g,"").replace("$","");let v=val.trim().replace(/"/g,"");ifStack.push(this.env[varName]===v);skipElse=this.env[varName]!==v;}catch(e){ifStack.push(false);skipElse=true;}continue;}
      if(line==="else"){skipElse=ifStack.length?ifStack[ifStack.length-1]:false;continue;}
      if(line==="fi"){if(ifStack.length)ifStack.pop();continue;}
      if(skipElse&&ifStack.length)continue;
      if(line.startsWith("echo ")){let text=line.slice(5).trim().replace(/^['"]|['"]$/g,"");for(let k in this.env)text=text.replace("$"+k,this.env[k]);output.push(text);continue;}
      if(line.includes("=")&&!line.startsWith("export")){let[k,v]=line.split("=",1);this.env[k.trim()]=v.trim().replace(/"/g,"");continue;}
      let subCmd=line.split(/\s+/)[0]||"";
      if(subCmd){let n=this.fs.resolve("/challenge/"+subCmd);if(n&&!n.isDir&&n.content){let r=this._runScript(n.content,line.split(/\s+/).slice(1));if(r)output.push(r);}}
    }return output.join("\n");
  }
  _ls(a){let sh=false,p=null,lo=false;for(let x of a){if(x.startsWith("-")){if(x.includes("a"))sh=true;if(x.includes("l"))lo=true;}else p=x;}
    let items=this.fs.ls(p,sh);if(!items)return"ls: cannot access '"+(p||".")+"': No such file";
    if(!items.length)return"";if(lo)return items.map(f=>{let pre=f.isDir?"d":"-";return pre+f.perms.slice(1)+" "+f.owner.padEnd(8)+" "+(f.isDir?f.name+"/":f.size+" "+f.name);}).join("\n");
    return items.map(f=>f.isDir?f.name+"/":f.name).join("  ");}
  _cat(a){if(!a.length)return"cat: missing file";let c=this.fs.cat(a[0]);return c!==null?c:"cat: "+a[0]+": No such file";}
  _find(a){let np=null,pp=null;for(let i=0;i<a.length;i++){if(a[i]==="-name"&&a[i+1])np=a[++i];else if(a[i]==="-size"&&a[i+1])np=a[++i].replace(/[+c]/g,"");}
    return this.fs.find(np).map(f=>f.name).join("\n")||"";}
  _grep(a){if(!a.length)return"";return this.fs.grep(a[0]).join("\n")||"";}
  _head(a){let n=10,p=null;for(let i=0;i<a.length;i++){if(a[i]==="-n"&&a[i+1])n=parseInt(a[++i]);else p=a[i];}
    let c=this.fs.cat(p);return c?c.split("\n").slice(0,n).join("\n"):"head: no file";}
  _tail(a){let n=10,p=null;for(let i=0;i<a.length;i++){if(a[i]==="-n"&&a[i+1])n=parseInt(a[++i]);else p=a[i];}
    let c=this.fs.cat(p);return c?c.split("\n").slice(-n).join("\n"):"tail: no file";}
  _cd(a){return this.fs.cd(a[0]||"/")?"":"cd: no such dir";}
  _pwd(){return this.fs.cwd;}
  _echo(a){return a.join(" ").replace(/"/g,"");}
  _whoami(){return this.env.user||"hacker";}
  _id(){return"uid=1000("+this.env.user+") gid=1000(hacker)";}
  _chmod(a){if(a.length<2)return"chmod: missing";let p=a[1];if(p.startsWith("~"))p="/home/hacker"+p.slice(1);let n=this.fs.resolve(p);if(n)n.perms=a[0];return n?"":'chmod: cannot access '+a[1]+': No such file';}
  _mkdir(a){if(!a.length)return"";let p=a[0];if(p.startsWith("~"))p="/home/hacker"+p.slice(1);
    if(p.startsWith("/")){let parts=p.split("/").filter(Boolean);let c=this.fs.root;for(let x of parts){if(!c.children[x])c.add(new VFile(x,true,"","drwxr-xr-x"));c=c.children[x];}return"";}
    this.fs.mkdir(this.fs.cwd,p);return"";}
  _touch(a){if(!a.length)return"";let p=a[0];if(p.startsWith("~"))p="/home/hacker"+p.slice(1);
    if(p.startsWith("/")){let pp=p.split("/").slice(0,-1).join("/")||"/";let fn=p.split("/").pop();this._ensureParent(p);this.fs.touch(pp,fn);return"";}
    this.fs.touch(this.fs.cwd,p);return"";}
  _ensureParent(p){if(p.startsWith("~"))p="/home/hacker"+p.slice(1);let parts=p.split("/").filter(Boolean).slice(0,-1);let c=this.fs.root;for(let x of parts){if(!c.children[x])c.add(new VFile(x,true,"","drwxr-xr-x"));c=c.children[x];}}
  _file(a){if(!a.length)return"";let n=this.fs.resolve(a[0]);return n?(n.isDir?"directory":"ASCII text"):"no such file";}
  _stat(a){if(!a.length)return"";let n=this.fs.resolve(a[0]);return n?"File: "+a[0]+"\nSize: "+n.size+" perms: "+n.perms:"no such file";}
  _wc(a){if(!a.length)return"";let c=this.fs.cat(a[0]);if(!c)return"";return c.split("\n").length+" "+c.split(/\s+/).length+" "+c.length+" "+a[0];}
  _strings(a){if(!a.length)return"";let c=this.fs.cat(a[0]);if(!c)return"";return c.match(/[^\x00-\x1F]{4,}/g)?.join("\n")||"";}
  _decode(a){if(a.length<2)return"usage: decode <text> <base64|hex|rot13>";
    let types=["base64","hex","rot13"];let dtype=a[a.length-1].toLowerCase();
    let text;if(types.includes(dtype)){text=a.slice(0,-1).join(" ").replace(/\n/g,"").replace(/ /g,"");}else{return"usage: decode <text> <base64|hex|rot13>";}
    try{if(dtype==="base64")return atob(text);if(dtype==="hex")return text.match(/.{1,2}/g).map(h=>String.fromCharCode(parseInt(h,16))).join("");
    if(dtype==="rot13")return text.replace(/[a-zA-Z]/g,c=>String.fromCharCode(c.charCodeAt(0)+(c.toLowerCase()>"m"?-13:13)));
    }catch(e){}return"decode error";}
  _encode(a){if(a.length<2)return"usage: encode <text> <base64|hex|rot13>";
    if(a[1]==="base64")return btoa(a[0]);if(a[1]==="hex")return Array.from(a[0]).map(c=>c.charCodeAt(0).toString(16)).join("");
    if(a[1]==="rot13")return a[0].replace(/[a-zA-Z]/g,c=>String.fromCharCode(c.charCodeAt(0)+(c.toLowerCase()>"m"?-13:13)));return"";}
  _caesar(a){if(a.length<2)return"usage: caesar <text> <shift>";let s=parseInt(a[1]);let dec=a.includes("decrypt");
    return a[0].replace(/[a-zA-Z]/g,c=>{let b=c<="Z"?65:97;return String.fromCharCode((c.charCodeAt(0)-b+(dec?-s:s)+26)%26+b);});}
  _bruteforce(a){if(!a.length)return"";let r=[];for(let s=0;s<26;s++){let d=a[0].replace(/[a-zA-Z]/g,c=>{let b=c<="Z"?65:97;return String.fromCharCode((c.charCodeAt(0)-b-s+26)%26+b);});r.push("["+String(s).padStart(2)+"] "+d+(s===13?" <- likely":""));}return r.join("\n");}
  _hash(a){if(!a.length)return"";let algo=a[1]||"md5";return"["+algo+"] "+Array.from(a[0]).map(c=>c.charCodeAt(0).toString(16)).join("").slice(0,32);}
  _env(){return Object.entries(this.env).map(([k,v])=>k+"="+v).join("\n");}
  _export(a){if(!a.length)return this._env();if(a[0].includes("=")){let[k,v]=a[0].split("=",1);this.env[k]=v;}return"";}
  _submit(a){return a.length?"__FLAG__"+a.join(" "):"usage: submit FLAG{...}";}
  _man(a){if(!a.length)return"Usage: man <command>";return"MAN PAGE: "+a[0]+"\nSee documentation for "+a[0]+".";}
  _hint(a){return"__HINT__";}
  _help(){return"ls cat find grep cd pwd echo chmod mkdir touch\nfile stat wc strings head tail\ndecode encode caesar bruteforce hash\nenv export man hint submit help exit";}
}

      "2.2":["cat /etc/cypherpunk.conf","export SECRET_HANDSHAKE=PGP_WAS_HERE_1991 && /challenge/auth"],
      "3.1":["ls -la /challenge/backdoor","/challenge/backdoor"],
      "3.2":["ls -la /challenge/backup.sh","echo '#!/bin/bash' > /challenge/backup.sh && echo 'cat /root/secret.txt' >> /challenge/backup.sh"],
      "4.1":["cat /challenge/gate.c","echo AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAATrue | /challenge/gate"]};
    let h=H[this.id]||["Explore the filesystem."];return h[Math.min(this.step++,h.length-1)];}
  getStudy(){
    const S={"1.1":"echo X > file   write\n echo X >> file  append\n cat file        read",
      "1.2":"ls -la          list hidden\n find / -size +0c  non-empty files",
      "1.3":"strings file    extract text\n decode <txt> base64|hex|rot13",
      "2.1":"PATH=dir:$PATH  add to path\n chmod +x file   make executable",
      "2.2":"env             show vars\n export KEY=val  set variable",
      "3.1":"chmod 4755 file SUID\n ls -la          see 's' in perms",
      "3.2":"crontab -l      list jobs\n world-writable = anyone can edit",
      "4.1":"char buf[64]; int auth;\n gets(buf) no bounds check!\n 65+ bytes overflow → overwrite auth"};return S[this.id]||"";}
}

// ═══════════════════════════════════════════════════════════════════════════
// GAME STATE
// ═══════════════════════════════════════════════════════════════════════════
const LEVEL_ORDER=["1.1","1.2","1.3","2.1","2.2","3.1","3.2","4.1"];
let state={current:"1.1",completed:[],flags:[],points:0,hackerName:null,level:null,mode:"menu"};

function save(){try{localStorage.setItem("void_state",JSON.stringify(state));}catch(e){}}
function load(){try{let s=localStorage.getItem("void_state");if(s){let d=JSON.parse(s);Object.assign(state,d);}}catch(e){}}
function isUnlocked(id){let i=LEVEL_ORDER.indexOf(id);return i===0||LEVEL_ORDER[i-1] in state.completed;}
function completeLevel(id){if(!state.completed.includes(id)){state.completed.push(id);state.flags.push(FLAGS[id]);state.points+=TRACKS[id.split(".")[0]].levels[id].diff.split("★").length*100;let i=LEVEL_ORDER.indexOf(id);if(i<LEVEL_ORDER.length-1)state.current=LEVEL_ORDER[i+1];}save();}

// ═══════════════════════════════════════════════════════════════════════════
// TERMINAL
// ═══════════════════════════════════════════════════════════════════════════
const term = new Terminal({
  theme:{background:"#0a0a0a",foreground:"#00ff41",cursor:"#00ff41",cursorAccent:"#0a0a0a",
    selectionBackground:"#00ff4133",black:"#0a0a0a",red:"#ff0040",green:"#00ff41",yellow:"#fffc00",
    blue:"#0066ff",magenta:"#cc00ff",cyan:"#00ffff",white:"#cccccc",
    brightBlack:"#555",brightRed:"#ff5555",brightGreen:"#55ff55",brightYellow:"#ffff55",
    brightBlue:"#5555ff",brightMagenta:"#ff55ff",brightCyan:"#55ffff",brightWhite:"#fff"},
  fontFamily:"'Fira Code','JetBrains Mono',monospace",fontSize:14,lineHeight:1.2,
  cursorBlink:true,cursorStyle:"block",scrollback:10000
});
const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById("terminal"));
fitAddon.fit();
window.addEventListener("resize",()=>fitAddon.fit());

let inputBuf="";
function write(s){term.write(s);}
function prompt(){
  if(state.mode==="menu"){
    let name=state.hackerName||"void";
    write("\x1b[32m["+state.current+"] "+name+"@void:~$\x1b[0m ");
  }else if(state.mode==="level"){
    write("\x1b[32mhacker@void:~$\x1b[0m ");
  }
}

function process(cmd){
  cmd=cmd.trim();if(!cmd)return"";
  // Menu commands (work regardless of mode for navigation)
  if(cmd==="help"||cmd==="menu"||cmd==="?"||cmd==="ayuda"){
    if(state.mode==="level")return"\n  [exit]      — Return to menu\n  [study]     — Study the concept\n  [hint]      — Get a hint\n  [submit X]  — Submit flag\n\n  Shell commands: ls cat find grep cd pwd echo chmod mkdir touch\n  file stat wc strings head tail decode encode caesar bruteforce hash\n  env export man hint submit help exit\n";
    return cmdHelp();
  }
  if(cmd==="play")return cmdPlay();
  if(cmd==="tracks")return cmdTracks();
  if(cmd==="status")return cmdStatus();
  if(cmd==="inventario"||cmd==="flags")return cmdInventory();
  if(cmd==="hackername")return cmdHackername();
  if(cmd==="walkthrough")return"Walkthrough mode coming soon. Use 'play' to start.";
  if(cmd==="riddles")return"Riddles mode coming soon. Use 'play' to start.";
  if(cmd==="salir"||cmd==="exit"){
    if(state.mode==="level"){state.mode="menu";state.level=null;return"Returned to menu.";}
    return"Goodbye. The void remembers.";
  }
  if(state.mode==="menu"){
    return"Unknown command. Type 'help'.";
  }
  if(state.mode==="level"){
    if(cmd==="study")return state.level.getStudy();
    if(cmd==="hint"||cmd==="mirar")return"\x1b[33m> "+state.level.getHint()+"\x1b[0m";
    let result=state.level.shell.exec(cmd);
    if(result==="__EXIT__"){state.mode="menu";state.level=null;return"Returned to menu.";}
    if(result.includes("__FLAG__")){
      let submitted=result.replace("__FLAG__","").trim();
      if(submitted===state.level.flag){
        state.level.solved=true;completeLevel(state.level.id);
        return"\x1b[32m══════════════════════════════\n  F L A G   C A P T U R E D\n══════════════════════════════\n\n  "+state.level.flag+"\n\n  +"+TRACKS[state.level.id.split(".")[0]].levels[state.level.id].diff.split("★").length*100+" points\n\x1b[0m";
      }return"\x1b[31minvalid flag\x1b[0m";
    }
    return result;
  }
  return"";
}

// ── Commands ─────────────────────────────────────────────────────────────
function cmdPlay(){
  let id=state.current;
  if(state.completed.includes(id))return"Level "+id+" already completed. Use 'tracks' to see progress.";
  if(!isUnlocked(id))return"Level "+id+" is locked. Complete previous levels first.";
  state.level=new Level(id,state);state.mode="level";
  let tr=TRACKS[id.split(".")[0]];
  return"\x1b[1mTRACK "+id.split(".")[0]+": "+tr.name+"\x1b[0m\n"+state.level.getLore()+"\n\n\x1b[1m"+state.level.getEnigma()+"\x1b[0m\nType 'help' for commands.\n";
}
function cmdHelp(){
  return"\n  play         — Campaign levels\n  walkthrough  — Guided tutorial\n  riddles      — Hacker history puzzles\n  hackername   — Generate serial alias\n  tracks       — View all tracks\n  status       — Progress & points\n  inventario   — Captured flags\n  salir        — Exit\n";
}
function cmdTracks(){
  let lines=["\n  TRACKS & LEVELS\n"];
  for(let tid in TRACKS){let tr=TRACKS[tid];lines.push("  TRACK "+tid+": "+tr.name);
    for(let lid in tr.levels){let lv=tr.levels[lid];let s=state.completed.includes(lid)?"[DONE]":isUnlocked(lid)?"[UNLOCKED]":"[LOCKED]";
      lines.push("    "+lid+"  "+lv.name.padEnd(28)+" "+lv.diff+"  "+s+"  +"+(lv.diff.split("★").length*100)+"pts");}lines.push("");}
  return lines.join("\n");
}
function cmdStatus(){
  let done=state.completed.length,total=8;
  let bar="█".repeat(Math.floor(done/total*30))+"░".repeat(30-Math.floor(done/total*30));
  return"\n  STATUS\n  points:   "+state.points+"\n  levels:   "+done+"/"+total+"\n  flags:    "+state.flags.length+"/"+total+"\n  current:  "+state.current+"\n  name:     "+(state.hackerName||"none")+"\n  ["+bar+"] "+done+"/"+total+"\n";
}
function cmdInventory(){
  if(!state.flags.length)return"\n  no flags yet.\n";
  return"\n  CAPTURED FLAGS\n"+state.flags.map(f=>"  "+f).join("\n")+"\n";
}
function cmdHackername(){
  let pool=["x","z","k","n","r","v","j","q","0x","nk","rx","v0","kz","zx","jn","qr",
    "n3k","z4x","r1f","k0d","v8n","x7r","j4z","q0x","n1x","z3k","r0x","k4n","v1d","x9z",
    "n0k","z1x","r4v","k7d","v0x","x3n","j8z","q1r","ph4","cr8","sh3","gh0","b1n","st4","h3x"];
  let name=pool[Math.floor(Math.random()*pool.length)];
  state.hackerName=name;save();
  return"\n\x1b[32m══════════════════════════════\n  S 3 R 1 4 L   1 D 3 N T 1 T Y\n══════════════════════════════\n\n  \x1b[1m"+name+"\x1b[0m\n\n  4ssum3 y0ur 1d3nt1ty.\x1b[0m\n";
}

// ── Input ────────────────────────────────────────────────────────────────
load();prompt();
term.onKey(({key,domEvent:e})=>{
  if(e.key==="Enter"){
    write("\r\n");
    if(inputBuf.trim()){let out=process(inputBuf);if(out)write(out+"\r\n");}
    inputBuf="";prompt();
  }else if(e.key==="Backspace"){
    if(inputBuf.length>0){inputBuf=inputBuf.slice(0,-1);term.write("\b \b");}
  }else if(e.ctrlKey&&e.key==="c"){
    write("^C\r\n");inputBuf="";prompt();
  }else if(e.ctrlKey&&e.key==="l"){
    term.clear();prompt();
  }else if(e.key==="Tab"){
    e.preventDefault();
    let cmds=["ls","cat","find","grep","cd","pwd","echo","chmod","mkdir","touch","file","stat","wc","strings","head","tail","decode","encode","caesar","bruteforce","hash","env","export","man","hint","submit","help","exit","play","tracks","status","inventario","hackername","salir"];
    let matches=cmds.filter(c=>c.startsWith(inputBuf));
    if(matches.length===1){inputBuf=matches[0];term.write("\r\x1b[K"+(state.mode==="menu"?"["+state.current+"] "+(state.hackerName||"void")+"@void:~$ ":"hacker@void:~$ ")+inputBuf);}
    else if(matches.length>1)write("\r\n"+matches.join("  ")+"\r\n");
    prompt();
  }else if(!e.ctrlKey&&!e.altKey&&!e.metaKey&&e.key.length===1){
    inputBuf+=e.key;term.write(key);
  }
});
term.onData(d=>{if(d.length>1&&!d.startsWith("\x1b")){inputBuf+=d;term.write(d);}});
function focusTerm(){term.focus();document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));document.querySelector(".tab").classList.add("active");}
term.focus();
</script>
